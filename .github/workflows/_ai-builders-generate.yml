name: AI Builders Digest Generator

on:
  workflow_call:
    inputs:
      digest_type:
        description: Digest cadence to generate
        required: true
        type: string
      scheduled_local_time:
        description: Configured Asia/Shanghai trigger time in HH:MM format
        required: true
        type: string
      scheduled_date_offset_days:
        description: Calendar-day offset from the scheduled Shanghai slot
        required: false
        type: number
        default: 0
      defer_unready_inputs:
        description: Skip safely when upstream feeds are not ready yet
        required: false
        type: boolean
        default: false
    secrets:
      DEEPSEEK_API_KEY:
        required: true

concurrency:
  group: ai-builders-digest-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.package.outputs.has_patch }}
      filename: ${{ steps.context.outputs.filename || steps.target.outputs.filename }}
      commit_message: ${{ steps.context.outputs.commit_message || steps.target.outputs.commit_message }}
    steps:
      - name: Check out digest repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check whether this digest still needs generation
        id: target
        env:
          DIGEST_TYPE: ${{ inputs.digest_type }}
          DIGEST_EVENT_NAME: ${{ github.event_name }}
          DIGEST_SCHEDULE_LOCAL_TIME: ${{ inputs.scheduled_local_time }}
          DIGEST_SCHEDULE_DATE_OFFSET_DAYS: ${{ inputs.scheduled_date_offset_days }}
          DIGEST_PREFLIGHT_ONLY: "true"
        run: node .github/scripts/prepare-digest-input.mjs

      - name: Check out latest Follow Builders feeds
        if: steps.target.outputs.should_generate == 'true'
        uses: actions/checkout@v5
        with:
          repository: zarazhangrui/follow-builders
          ref: main
          path: _follow-builders
          # Weekly runs need enough feed commits to bracket the previous
          # Monday-to-Monday window. The small fixed depth keeps this simple.
          fetch-depth: 30
          persist-credentials: false

      - name: Test digest automation scripts
        if: steps.target.outputs.should_generate == 'true'
        run: node --test .github/scripts/*.test.mjs

      - name: Validate and stage feed inputs
        if: steps.target.outputs.should_generate == 'true'
        id: context
        env:
          DIGEST_TYPE: ${{ inputs.digest_type }}
          DIGEST_EVENT_NAME: ${{ github.event_name }}
          DIGEST_SCHEDULE_LOCAL_TIME: ${{ inputs.scheduled_local_time }}
          DIGEST_SCHEDULE_DATE_OFFSET_DAYS: ${{ inputs.scheduled_date_offset_days }}
          DEFER_UNREADY_INPUTS: ${{ inputs.defer_unready_inputs }}
          FOLLOW_BUILDERS_DIR: _follow-builders
          DIGEST_INPUT_DIR: .codex-input
          MAX_FEED_AGE_HOURS: "24"
          # Bounded upstream scheduler gaps are preserved in run-context and
          # must be disclosed in every generated weekly edition. Larger gaps
          # still stop publication rather than silently omitting a full day.
          MAX_SNAPSHOT_GAP_HOURS: "18"
          WEEKLY_HISTORY_LIMIT: "30"
          MIN_WEEKLY_SNAPSHOTS: "8"
        run: node .github/scripts/prepare-digest-input.mjs

      - name: Remove the source checkout
        if: steps.context.outputs.should_generate == 'true'
        run: rm -rf -- "$GITHUB_WORKSPACE/_follow-builders"

      - name: Generate digest with Codex and DeepSeek
        if: steps.context.outputs.should_generate == 'true'
        id: codex
        # v1.12 can hang after generation and make the hosted runner lose
        # communication (openai/codex-action#150). Pin the last working v1.11.
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56
        with:
          openai-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          responses-api-endpoint: https://api.deepseek.com/responses
          model: deepseek-v4-flash
          prompt-file: ${{ steps.context.outputs.prompt_file }}
          effort: low
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          output-file: ${{ runner.temp }}/codex-output.md

      - name: Validate changes and create patch
        if: steps.context.outputs.should_generate == 'true'
        id: package
        shell: bash
        env:
          DIGEST_TYPE: ${{ inputs.digest_type }}
          DIGEST_FILENAME: ${{ steps.context.outputs.filename }}
        run: |
          set -euo pipefail

          expected=(
            "README.md"
            "README.zh-CN.md"
            "en/$DIGEST_TYPE/$DIGEST_FILENAME"
            "zh/$DIGEST_TYPE/$DIGEST_FILENAME"
            "bilingual/$DIGEST_TYPE/$DIGEST_FILENAME"
          )

          for file in "${expected[@]:2}"; do
            if [[ ! -f "$file" ]]; then
              echo "Expected output is missing: $file" >&2
              exit 1
            fi
          done

          node .github/scripts/validate-digest-output.mjs

          rm -rf -- "$GITHUB_WORKSPACE/.codex-input"

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all | cut -c4-
          )

          for file in "${changed[@]}"; do
            allowed=false
            for expected_file in "${expected[@]}"; do
              if [[ "$file" == "$expected_file" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Codex changed an unexpected path: $file" >&2
              exit 1
            fi
          done

          git add -N -- "${expected[@]}"
          patch_file="$RUNNER_TEMP/digest.patch"
          git diff --binary -- "${expected[@]}" > "$patch_file"

          if [[ -s "$patch_file" ]]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "Digest already matches the requested output; nothing to publish."
          fi

      - name: Upload digest patch
        if: steps.context.outputs.should_generate == 'true' && steps.package.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest.patch
          if-no-files-found: error
          retention-days: 1

      - name: Record deferred generation
        if: steps.context.outputs.skip_reason == 'inputs_not_ready'
        run: echo "Upstream feeds are not ready; the recovery slot will try once more." >> "$GITHUB_STEP_SUMMARY"

      - name: Record duplicate prevention
        if: steps.target.outputs.skip_reason == 'already_exists' || steps.context.outputs.skip_reason == 'already_exists'
        run: echo "The target digest already exists; skipped before calling the model." >> "$GITHUB_STEP_SUMMARY"

      - name: Record superseded recovery
        if: steps.target.outputs.skip_reason == 'superseded' || steps.context.outputs.skip_reason == 'superseded'
        run: echo "A newer digest is already published; skipped this late recovery to keep README monotonic." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: generate
    if: needs.generate.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download digest patch
        uses: actions/download-artifact@v4
        with:
          name: digest-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest-patch

      - name: Apply and validate patch
        shell: bash
        env:
          DIGEST_TYPE: ${{ inputs.digest_type }}
          DIGEST_FILENAME: ${{ needs.generate.outputs.filename }}
        run: |
          set -euo pipefail

          git apply --index "$RUNNER_TEMP/digest-patch/digest.patch"

          expected=(
            "README.md"
            "README.zh-CN.md"
            "en/$DIGEST_TYPE/$DIGEST_FILENAME"
            "zh/$DIGEST_TYPE/$DIGEST_FILENAME"
            "bilingual/$DIGEST_TYPE/$DIGEST_FILENAME"
          )
          mapfile -t staged < <(git diff --cached --name-only)

          if [[ ${#staged[@]} -eq 0 ]]; then
            echo "Patch did not stage any files." >&2
            exit 1
          fi

          for file in "${staged[@]}"; do
            allowed=false
            for expected_file in "${expected[@]}"; do
              if [[ "$file" == "$expected_file" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Patch contains an unexpected path: $file" >&2
              exit 1
            fi
          done

      - name: Commit and push directly to main
        env:
          COMMIT_MESSAGE: ${{ needs.generate.outputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main
