name: AI Builders Weekly Digest

on:
  schedule:
    # Monday 08:00 Asia/Shanghai (GitHub schedules use UTC).
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    uses: ./.github/workflows/_ai-builders-generate.yml
    with:
      digest_type: weekly
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
