name: AI Builders Daily Digest

on:
  schedule:
    # 16:30 Asia/Shanghai (GitHub schedules use UTC). This leaves a
    # buffer after Follow Builders' daily feed update.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    uses: ./.github/workflows/_ai-builders-generate.yml
    with:
      digest_type: daily
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
