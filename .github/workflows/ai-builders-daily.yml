name: AI Builders Daily Digest

on:
  schedule:
    # 07:00 Asia/Shanghai (GitHub schedules use UTC).
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    uses: ./.github/workflows/_ai-builders-generate.yml
    with:
      digest_type: daily
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
